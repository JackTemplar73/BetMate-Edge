name: Deploy odds worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - cloudflare/**
      - wrangler.toml
      - .github/workflows/deploy-worker.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check required secrets
        env:
          HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ODDS_API_KEY: ${{ secrets.ODDS_API_KEY != '' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN present: $HAS_CLOUDFLARE_TOKEN"
          echo "ODDS_API_KEY present: $HAS_ODDS_API_KEY"
          if [ "$HAS_CLOUDFLARE_TOKEN" != "true" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN repository secret."
            exit 1
          fi
          if [ "$HAS_ODDS_API_KEY" != "true" ]; then
            echo "Missing ODDS_API_KEY repository secret."
            exit 1
          fi

      - name: Deploy Cloudflare Worker
        id: deploy_worker
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set +e
          npx wrangler@latest secret put ODDS_API_KEY --config wrangler.toml < <(printf "%s" "$ODDS_API_KEY") > /tmp/wrangler.log 2>&1
          secret_status=$?
          npx wrangler@latest deploy --config wrangler.toml >> /tmp/wrangler.log 2>&1
          deploy_status=$?
          {
            echo "Secret upload status: $secret_status"
            echo "Deploy status: $deploy_status"
            echo
            sed -E 's/[A-Za-z0-9_-]{30,}/[redacted]/g' /tmp/wrangler.log
          } > cloudflare/last-deploy-error.txt
          if [ "$secret_status" -ne 0 ] || [ "$deploy_status" -ne 0 ]; then
            exit 1
          fi

      - name: Publish deploy error
        if: steps.deploy_worker.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/last-deploy-error.txt
          git commit -m "Record worker deploy error [skip ci]" || true
          git push || true

      - name: Fail deploy after publishing error
        if: steps.deploy_worker.outcome == 'failure'
        run: exit 1
