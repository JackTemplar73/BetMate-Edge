name: Deploy analysis site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - CNAME
      - index.html
      - ufcgd.html
      - src/**
      - data/**
      - .github/workflows/deploy-analysis-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-analysis-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4
