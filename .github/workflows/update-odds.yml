name: Refresh odds

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # Wake every 5 minutes; scripts/update_odds.mjs decides whether this run
    # should refresh now based on kickoff proximity.
    - cron: '*/5 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-odds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh AU market scan when due
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_TARGET_BOOKMAKERS: sportsbet,tab,pointsbetau,neds,bet365,betfair_ex_au
        run: node scripts/deep_market_scan.mjs

      - name: Refresh prices when due
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_SPORT_KEYS: soccer_fifa_world_cup
        run: node scripts/update_odds.mjs

      - name: Check Sportsbet player props directly
        continue-on-error: true
        run: node scripts/check_direct_player_props.mjs

      - name: Publish updated odds
        run: |
          if git diff --quiet data/weekend_payload.json src/embeddedData.js data/bet_history.json src/embeddedBetHistory.js data/player_props_watchlist.json src/embeddedPlayerProps.js data/oddsapi_au_market_coverage.json; then
            echo "No odds changes to publish."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/weekend_payload.json src/embeddedData.js data/bet_history.json src/embeddedBetHistory.js data/player_props_watchlist.json src/embeddedPlayerProps.js data/oddsapi_au_market_coverage.json
            git commit -m "Auto refresh odds"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy refreshed site
        id: deploy-pages
        uses: actions/deploy-pages@v4
